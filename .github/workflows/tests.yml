name: tests

on: [push]

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]
        laravel: [12.*, 13.*]
        livewire: [3.*, 4.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - LW${{ matrix.livewire }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          ini-values: pcov.directory=src
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "livewire/livewire:${{ matrix.livewire }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-suggest

      - name: Execute tests
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

  dependencies:

    runs-on: ubuntu-latest

    name: Newest majors resolve

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none

      # Guards against a dependency silently capping a core package below its
      # newest allowed major (e.g. a transitive constraint blocking Pest v5).
      # `composer require -W` exits non-zero if the newest majors can't be
      # resolved together, instead of quietly falling back to an older version.
      - name: Require newest majors and resolve
        run: |
          composer require --dev -W --prefer-stable --prefer-dist --no-interaction \
            "pestphp/pest:^5" \
            "phpunit/phpunit:^13" \
            "livewire/livewire:^4"

      - name: Execute tests
        run: vendor/bin/phpunit
